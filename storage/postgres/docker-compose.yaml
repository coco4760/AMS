services:
  postgres:
    image: rd.clouditera.com/sca-sast-lib/postgres:15-alpine
    restart: always
    volumes:
      - ${INSTALL_LOCAL}/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PG_PORT}:5432"
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 30s
      timeout: 60s
      retries: 3
