services:
  rag_service_backend:
    image: rd.clouditera.com/aigc/rag/rag_service/backend:x86_64-0.6.1.post2
    ports:
      - "38082:8081"
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - POSTGRES_SERVER=rag_service_postgres
      - REDIS_SERVER=rag_service_redis
      - VECTOR_STORE_SERVER_HOST=rag_service_postgres
    env_file:
      - .env
    depends_on:
      - rag_service_postgres
      - rag_service_redis
    restart: always
  
  slow_parse_worker:
    image: rd.clouditera.com/aigc/rag/rag_service/backend:x86_64-0.6.1.post2
    volumes:
      - ./data:/app/data
    command: >
      celery -A backend.core.celery_app
      worker --loglevel=info
      --concurrency=1
      --pool=prefork
      --hostname=slow_parse_worker@%h
      --queues=document_slow_parse_queue
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
      - REDIS_SERVER=rag_service_redis
      - POSTGRES_SERVER=rag_service_postgres
      - VECTOR_STORE_SERVER_HOST=rag_service_postgres
    depends_on:
      - rag_service_postgres
      - rag_service_redis
    restart: always
       
  parse_worker:
    image: rd.clouditera.com/aigc/rag/rag_service/backend:x86_64-0.6.1.post2
    volumes:
      - ./data:/app/data
    command: >
      celery -A backend.core.celery_app
      worker --loglevel=info
      --concurrency=4
      --pool=prefork
      --hostname=parse_worker@%h
      --queues=document_parse_queue
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
      - REDIS_SERVER=rag_service_redis
      - POSTGRES_SERVER=rag_service_postgres
      - VECTOR_STORE_SERVER_HOST=rag_service_postgres
    depends_on:
      - rag_service_postgres
      - rag_service_redis
    restart: always
  
  vectorize_worker:
    image: rd.clouditera.com/aigc/rag/rag_service/backend:x86_64-0.6.1.post2
    volumes:
      - ./data:/app/data
    command: >
      celery -A backend.core.celery_app
      worker --loglevel=info
      --concurrency=4
      --pool=prefork
      --hostname=vectorize_worker@%h
      --queues=document_vectorize_queue
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
      - REDIS_SERVER=rag_service_redis
      - POSTGRES_SERVER=rag_service_postgres
      - VECTOR_STORE_SERVER_HOST=rag_service_postgres
    depends_on:
      - rag_service_postgres
      - rag_service_redis
    restart: always

  system_worker:
    image: rd.clouditera.com/aigc/rag/rag_service/backend:x86_64-0.6.1.post2
    volumes:
      - ./data:/app/data
    command: >
      celery -A backend.core.celery_app
      worker --loglevel=info
      --concurrency=4
      --pool=prefork
      --hostname=system_worker@%h
      --queues=system_task_queue
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
      - REDIS_SERVER=rag_service_redis
      - POSTGRES_SERVER=rag_service_postgres
      - VECTOR_STORE_SERVER_HOST=rag_service_postgres
    depends_on:
      - rag_service_postgres
      - rag_service_redis
    restart: always

  rag_service_flower:
    image: rd.clouditera.com/aigc/rag/rag_service/backend:x86_64-0.6.1.post2
    ports:
      - "35555:5555"
    command: >
      celery -A backend.core.celery_app flower
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
      - REDIS_SERVER=rag_service_redis
      - POSTGRES_SERVER=rag_service_postgres
      - VECTOR_STORE_SERVER_HOST=rag_service_postgres
    depends_on:
      - rag_service_postgres
      - rag_service_redis
    restart: always
  
  rag_service_frontend:
    image: rd.clouditera.com/aigc/rag/rag_service/frontend:x86_64-0.6.1.post2
    ports:
      - "8082:8080"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - rag_service_backend

  # 数据库服务
  rag_service_postgres:
    image: rd.clouditera.com/docker/vchord-postgres:pg17-v0.5.3
    ports:
      - "5432:5432"
    command: >
      postgres -c shared_preload_libraries=vchord -c max_connections=1000 -c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=4MB -c maintenance_work_mem=64MB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: always

  rag_service_redis:
    image: rd.clouditera.com/docker/redis:8.0.2
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./redis-data:/data
      - ./redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf
    restart: always

  rag_service_qdrant:
    image: rd.clouditera.com/docker/qdrant:v1.15
    ports:
      - "6333:6333"
      - "6334:6334"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./qdrant-data:/qdrant/storage
    restart: always
