services:
  rag_service_backend:
    image: rd.clouditera.com/aigc/rag_service:x86_64-0.5.5-backend
    ports:
      - "38081:8081"
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    depends_on:
      - rag_service_redis
    restart: always
  
  slow_parse_worker:
    image: rd.clouditera.com/aigc/rag_service:x86_64-0.5.5-backend
    volumes:
      - ./data:/app/data
    command: >
      celery -A backend.core.celery_app
      worker --loglevel=info
      --concurrency=4
      --pool=prefork
      --hostname=slow_parse_worker@%h
      --queues=document_slow_parse_queue
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
    depends_on:
      - rag_service_redis
    restart: always
       
  parse_worker:
    image: rd.clouditera.com/aigc/rag_service:x86_64-0.5.5-backend
    volumes:
      - ./data:/app/data
    command: >
      celery -A backend.core.celery_app
      worker --loglevel=info
      --concurrency=4
      --pool=prefork
      --hostname=parse_worker@%h
      --queues=document_parse_queue
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
    depends_on:
      - rag_service_redis
    restart: always
  
  vectorize_worker:
    image: rd.clouditera.com/aigc/rag_service:x86_64-0.5.5-backend
    volumes:
      - ./data:/app/data
    command: >
      celery -A backend.core.celery_app
      worker --loglevel=info
      --concurrency=4
      --pool=prefork
      --hostname=vectorize_worker@%h
      --queues=document_vectorize_queue
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
    depends_on:
      - rag_service_redis
    restart: always

  system_worker:
    image: rd.clouditera.com/aigc/rag_service:x86_64-0.5.5-backend
    volumes:
      - ./data:/app/data
    command: >
      celery -A backend.core.celery_app
      worker --loglevel=info
      --concurrency=4
      --pool=prefork
      --hostname=system_worker@%h
      --queues=system_task_queue
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
    depends_on:
      - rag_service_redis
    restart: always

  rag_service_flower:
    image: rd.clouditera.com/aigc/rag_service:x86_64-0.5.5-backend
    ports:
      - "35555:5555"
    command: >
      celery -A backend.core.celery_app flower
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
    depends_on:
      - rag_service_redis
    restart: always
  
  rag_service_frontend:
    image: rd.clouditera.com/aigc/rag_service:x86_64-0.5.5-frontend
    ports:
      - "38082:8080"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - rag_service_backend

  rag_service_redis:
    image: rd.clouditera.com/library/redis:latest
    ports:
      - "36379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

