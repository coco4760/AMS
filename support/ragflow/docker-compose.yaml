services:
  redis-rag:
    image: rd.clouditera.com/sca-sast-lib/library/redis:7.2.0
    restart: always
    volumes:
      - ${INSTALL_LOCAL}/rag_data/redis/data:/data
    command: redis-server --requirepass clouditera
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    ports:
      - "26379:6379"

  storage-rag:
    image: rd.clouditera.com/infra/minio:RELEASE.2023-08-16T20-17-30Z
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - ${INSTALL_LOCAL}/rag_data/minioData:/data

  elasticsearch-rag:
    image: rd.clouditera.com/sca-sast-lib/library/elasticsearch:8.12.2
    restart: always
    environment:
      ES_USER: ${ES_USER}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
      xpack.security.enabled: true
      discovery.type: single-node
    ports:
      - "29200:9200"
      - "29300:9300"
    volumes:
      - ${INSTALL_LOCAL}/rag_data/es/data:/usr/share/elasticsearch/data
      - ${INSTALL_LOCAL}/rag_data/es/plugins:/usr/share/elasticsearch/plugins

  ragflow:
    image: rd.clouditera.com/aigc/ai-intelligence-rag:${RAG_VERSION}
    depends_on:
      - storage-rag
      - elasticsearch-rag
      - redis-rag
    env_file:
      - .env
    ports:
      - 9380:9380
      - 18082:80
    volumes:
      - ./nginx:/etc/nginx
      - ./deepdoc:/ragflow/rag/res/deepdoc
      # 新增配置
      - ./synonym.json:/ragflow/rag/res/synonym.json
    environment:
      - TZ=${TIMEZONE}
      - HF_ENDPOINT=https://huggingface.co
      # - MACOS=${MACOS}
    restart: always
