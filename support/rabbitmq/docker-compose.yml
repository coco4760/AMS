version: '3.8'

services:
  rabbitmq:
    image: rd.clouditera.com/library/rabbitmq:4.1.3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: clouditera
      RABBITMQ_DEFAULT_PASS: clouditera
    ports:
      - "8672:5672"    # AMQP 协议端口
      - "18672:15672"   # Web 管理控制台端口
    restart: unless-stopped