services:
  mysql:
    image: rd.clouditera.com/sca-sast-lib/library/mysql:8.0.34
    command: [ "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci" ]
    ports:
      - "${MYSQL_PORT:-10001}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ${INSTALL_LOCAL}/mysql:/var/lib/mysql
      - ../../_data/base/mysql:/docker-entrypoint-initdb.d
      - ./mysql_conf/my.cnf:/etc/my.cnf
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
