services:
  storage:
    image: rd.clouditera.com/docker/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command:
      [
        'server',
        '/data',
        '--console-address',
        ':9001'
      ]
    ports:
      - "${MINIO_API_PORT:-10006}:9000"
      - "${MINIO_CONSOLE_PORT:-10007}:9001"
    volumes:
      - ./minioData:/data
