services:
  mineru-cpu:
    image: rd.clouditera.com/aigc/etl/mineru:v1.3.12-cpu
    restart: always
    ports:
      - "48000:8000"
  mineru-gpu:
    profiles: [mineru-gpu]
    image: rd.clouditera.com/aigc/etl/mineru:v1.3.12
    restart: always
    ports:
      - "48000:8000"

    # GPU support
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
