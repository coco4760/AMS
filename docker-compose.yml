version: '3.8'

services:
  invitation-code-api:
    build: .
    container_name: invitation-code-api
    ports:
      - "30111:30111"
    environment:
      # 数据库配置（必需）
      - DB_HOST=${DB_HOST:-192.168.34.6}
      - DB_PORT=${DB_PORT:-10001}
      - DB_NAME=${DB_NAME:-clouditera_aigc}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}

      # API 配置（可选）
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-30111}
      - API_DEBUG=${API_DEBUG:-false}
    restart: unless-stopped
    networks:
      - invitation-code-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:30111/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  invitation-code-network:
    driver: bridge
