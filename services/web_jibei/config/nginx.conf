worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    client_max_body_size 5120M;
    client_body_timeout 3600s;
    client_body_buffer_size 10M;

    proxy_connect_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;


    proxy_buffer_size 32k;      # 增加代理缓存大小
    proxy_buffers 16 32k;       # 设置多个缓存块
    proxy_busy_buffers_size 64k;# 设置代理忙碌缓冲区大小

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 3600;

    map $http_upgrade $connection_upgrade {
        default keep-alive;
        'websocket' upgrade;
    }

    server {
        listen 80;
        listen  [::]:80;
        server_name  localhost;
        # server_name  test.sourcefuzz.clouditera.com;

        #ssl_certificate      ./ssl/9146914_test.sourcefuzz.clouditera.com.pem;
        #ssl_certificate_key  ./ssl/9146914_test.sourcefuzz.clouditera.com.key;

        # ssl_session_cache    shared:SSL:1m;
        # ssl_session_timeout  20m;
        #ssl_ciphers  HIGH:!aNULL:!MD5;
        #ssl_prefer_server_ciphers  on;
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        location /clientapi/ {
#             rewrite  ^/api/(.*?)$ /$1 last;
            proxy_set_header x-forwarded-for  $remote_addr;
            proxy_pass 'http://kong:8000';
            proxy_http_version 1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "Upgrade";
        }
       location /authapi/ {
#             rewrite  ^/api/(.*?)$ /$1 last;
            proxy_set_header x-forwarded-for  $remote_addr;
            proxy_pass 'http://kong:8000';
            proxy_http_version            1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "Upgrade";
        }
       location /sastapi/ {
#             rewrite  ^/api/(.*?)$ /$1 last;
            proxy_set_header x-forwarded-for  $remote_addr;
            proxy_pass 'http://kong:8000';
            proxy_http_version            1.1;
            proxy_set_header Upgrade "websocket";
            proxy_set_header Connection "Upgrade";
        }
       location /plugin/ {
#             rewrite  ^/api/(.*?)$ /$1 last;
            proxy_set_header x-forwarded-for  $remote_addr;
            proxy_pass 'http://kong:8000';
            proxy_http_version            1.1;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
