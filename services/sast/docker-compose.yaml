services:
  sast-http:
    image: rd.clouditera.com/aigc/sast-http-api:${SAST_HTTP_VER}
    restart: always
    environment:
      CONTEXT_PATH: /sastapi
    ports:
      - "${SAST_HTTP_PORT}:80"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/application.yml:/app/application.yml
      - ${INSTALL_LOCAL}/wuji/res:/tmp/sast/res
      - ${INSTALL_LOCAL}/wuji/code:/tmp/sast/code
