services:
  client-web-html:
    image: rd.clouditera.com/aigc/wuji/client-web:v3.4.57
    restart: always
    ports:
      - '80:80'
    extra_hosts:
      - "kong.host.com:${KONG_HOST}"
      - "kong:${KONG_HOST}"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
  client-web-html-jibei:
    profiles: ["jibei"]
    image: rd.clouditera.com/aigc/wuji/jibei-web:v1.0.23
    restart: always
    ports:
      - '80:80'
    extra_hosts:
      - "kong.host.com:${KONG_HOST}"
      - "kong:${KONG_HOST}"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
  client-web-html-guowang:
    profiles: ["guowang"]
    image: rd.clouditera.com/aigc/wuji/guowang-web:v1.0.10
    restart: always
    ports:
      - '80:80'
    extra_hosts:
      - "kong.host.com:${KONG_HOST}"
      - "kong:${KONG_HOST}"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
