services:
  client-http:
    image: rd.clouditera.com/aigc/wuji/client-http-api:v4.0.12
    restart: always
    environment:
      CONTEXT_PATH: /clientapi
      TZ: Asia/Shanghai
      SWAGGER_UI: false
    env_file:
      - .env
    volumes:
      - ./config/application.yml:/app/resources/application.yml
    ports:
      - "${CLIENT_HTTP_PORT:-20002}:80"
