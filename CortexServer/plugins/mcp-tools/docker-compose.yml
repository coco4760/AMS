services:
  mcp-tool:
    image: rd.clouditera.com/aigc/plugins/mcp-tool:v1.0.13
    restart: always
    ports:
      - "${MCP_TOOLS_PORT:-20025}:8081"
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Duser.timezone=Asia/Shanghai
    cap_add:
      - NET_RAW
      - NET_ADMIN
    network_mode: "bridge"
