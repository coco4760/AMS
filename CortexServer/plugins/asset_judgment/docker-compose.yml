services:
  assetmind:
    image: rd.clouditera.com/aigc/plugins/assetmind:2.3.2
    container_name: assetmind
    ports:
      - "${ASSET_JUDGMENT_PORT:-20015}:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DEBUG=false
      - LOG_LEVEL=INFO
      - PIPELINE_TOTAL_TIMEOUT=15.0
      - MAX_CONCURRENT_REQUESTS=30
      - REQUEST_QUEUE_SIZE=100
      - MAX_BATCH_SIZE=20
      - DNS_TIMEOUT=1.0
      - TLS_SOCKET_TIMEOUT=2.0
      - TLS_HANDSHAKE_TIMEOUT=3.0
      - WHOIS_READ_TIMEOUT=1.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 解决权限问题：以root用户运行，确保能写入挂载的目录
    user: "0:0"