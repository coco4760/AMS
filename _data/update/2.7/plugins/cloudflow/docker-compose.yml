services:
  cloudflow_backend:
    image: rd.clouditera.com/aigc/cloudflow:0.5.3.1
    ports:
      - "8032:8082"
    volumes:
      - ./data/backend:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - REDIS_HOST=cloudflow_redis
      - POSTGRES_SERVER=cloudflow_postgres
      - POSTGRES_PASSWORD=C10ud1tera2025_
      - POSTGRES_PORT=5432
      - UPLOAD_DIR=/app/data/uploads
      - WORKSPACE_DIR=/app/data/workspace
      - CACHE_DIR=/app/data/cache
      - AGENT_REGISTRY=http://cloudflow_backend:8082/
      - HOSTNAME=cloudflow_backend
    env_file:
      - .env
    depends_on:
      - cloudflow_postgres
      - cloudflow_redis
      - high_priority_tasks_worker
    restart: always
    networks:
      - cloudflow-network

  high_priority_tasks_worker:
    image: rd.clouditera.com/aigc/cloudflow:0.5.3.1
    volumes:
      - ./data/backend:/app/data
    # 高优先级任务队列用于保证需要快速响应的任务能够及时执行, 并发数量默认与cloudflow/backend/core/settings.py中的
    # AppSettings.BACKEND_HIGH_PRIORITY_WORKER_NUM一致
    command: >
      celery -A cloudflow.main.celery_app
      worker --loglevel=info
      --pool=prefork
      --autoscale=3,3
      --hostname=high_priority_tasks_worker
      --queues=high_priority_tasks_queue
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=true
      - REDIS_HOST=cloudflow_redis
      - POSTGRES_SERVER=cloudflow_postgres
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=C10ud1tera2025_
      - CACHE_DIR=/app/data/cache
      - WORKSPACE_DIR=/app/data/workspace
      - AGENT_REGISTRY=http://cloudflow_backend:8082/
      - HOSTNAME=high_priority_tasks_worker
    depends_on:
      - cloudflow_postgres
      - cloudflow_redis
    restart: always
    networks:
      - cloudflow-network

  cloudflow_postgres:
    image: rd.clouditera.com/docker/pgvector:pg17
    ports:
      - "45432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=C10ud1tera2025_
      - POSTGRES_DB=cloudflow
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: always
    networks:
      - cloudflow-network

  cloudflow_redis:
    image: rd.clouditera.com/docker/redis:latest
    ports:
      - "46379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    networks:
      - cloudflow-network

networks:
  cloudflow-network:
    driver: bridge

