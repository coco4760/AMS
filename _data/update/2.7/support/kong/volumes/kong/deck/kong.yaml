_format_version: "3.0"
plugins:
- config:
    bandwidth_metrics: true
    latency_metrics: true
    per_consumer: true
    status_code_metrics: true
    upstream_health_metrics: true
  enabled: true
  name: prometheus
  protocols:
  - grpc
  - grpcs
  - http
  - https
services:
- connect_timeout: 600000
  enabled: true
  host: authhttp
  name: authapi
  port: 18889
  protocol: http
  read_timeout: 600000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: authapi
    path_handling: v0
    paths:
    - /authapi
    preserve_host: false
    protocols:
    - http
    regex_priority: 0
    request_buffering: false
    response_buffering: false
    strip_path: false
    tags:
    - authapi
  tags:
  - authapi
  write_timeout: 600000
- connect_timeout: 6000000
  enabled: true
  host: clienthttp
  name: clientapi
  port: 18888
  protocol: http
  read_timeout: 6000000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: clientapi
    path_handling: v0
    paths:
    - /clientapi
    preserve_host: false
    protocols:
    - http
    regex_priority: 0
    request_buffering: false
    response_buffering: false
    strip_path: false
    tags:
    - clientapi
  tags:
  - clientapi
  write_timeout: 600000
- connect_timeout: 600000
  enabled: true
  host: ai-plugin
  name: plugin
  port: 18002
  protocol: http
  read_timeout: 600000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: plugin
    path_handling: v0
    paths:
    - /plugin
    preserve_host: false
    protocols:
    - http
    regex_priority: 0
    request_buffering: false
    response_buffering: false
    strip_path: true
    tags:
    - ai-plugin
  tags:
  - ai-plugin
  write_timeout: 600000
- connect_timeout: 600000
  enabled: true
  host: sasthttp
  name: sastapi
  port: 18887
  protocol: http
  read_timeout: 6000000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: sastapi
    path_handling: v0
    paths:
    - /sastapi
    preserve_host: false
    protocols:
    - http
    regex_priority: 0
    request_buffering: false
    response_buffering: false
    strip_path: false
    tags:
    - sastapi
  tags:
  - sastapi
  write_timeout: 600000
