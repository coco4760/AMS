services:
  paper-app:
    image: rd.clouditera.com/aigc/plugins/paper-api:1.7
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./paper_storage:/app/paper_storage
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
