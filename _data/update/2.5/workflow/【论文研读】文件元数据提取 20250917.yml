          text: "输入JSON列表：{{#1758091986783.output#}}\n你的任务是基于输入的多个切片元数据提取结果 JSON列表，进行汇总并生成一份完整的论文标准化\
            \ JSON。\n请严格按照字段要求合并内容，不要输出任何多余文字、提示或解释。\n必须有 严格的标点符号（如冒号、逗号、引号、括号、句号等都必须符合标准）。\n\
            若字段信息无法获取，请返回空字符串 “” 或空数组 []。\n\n合并规则：\n  1.  language：若所有切片一致则直接输出；若不一致则以出现频率最高的值为准。\n\
            \  2.  title：从包含标题的切片中提取，若多个切片重复，去重保留一份。\n  3   author: [\"作者1\", \"作者2\"\
