          : arg1}]}\n\n    slices = [''.join(tokens[i:i+WINDOW_TOK])\n           \
          \   for i in range(0, len(tokens)-WINDOW_TOK+1, STEP_TOK)]\n\n    selected\
          \ = random.sample(slices, min(10, len(slices)))\n    return {\"result\"\
          : [{\"text\": s} for s in selected]}"
