            \  5.  title_zh：直接取标题翻译结果（如有多个，以第一个非空为准）。\n  6.  abstract_zh：对应 abstract\
            \ 的翻译，只取一次。\n  7.  opensource_code_url：合并所有切片中的 URL，保持顺序并去重。\n  8.  paper_type：根据整体内容，若切片间结果不一致，则选择多数出现的类别。\n\
            \  9.  ai_abstract：只生成一次（基于最终汇总后的 title、abstract、keywords）。\n  10. ai_note：合并所有切片的章节笔记，保持顺序输出；\n\
            \  • 若章节重复（标题相同），则合并为一条；\n  • 若不同，则依顺序追加。\n  11. content_scores：仅保留一份完整评分（若多个切片都有，选择信息最完整的一份）。\n\
            \  12. recommended_qa：合并所有切片的问题，去重后选取 3 条最核心、最完整的。\n  13. keywords：合并所有切片关键词，去重后输出\
