    - data:
        code: "import socket\nfrom urllib.parse import urlparse\nimport idna\nimport\
          \ re\n\ndef is_valid_ipv4(address: str) -> bool:\n    \"\"\"检查是否为合法 IPv4\
          \ 地址\"\"\"\n    try:\n        socket.inet_pton(socket.AF_INET, address)\n\
          \        if address.count('.') == 3 and all(0 <= int(part) <= 255 for part\
          \ in address.split('.')):\n            return True\n        return False\n\
          \    except (socket.error, ValueError):\n        return False\n\ndef is_valid_ipv6(address:\
          \ str) -> bool:\n    \"\"\"检查是否为合法 IPv6 地址\"\"\"\n    try:\n        socket.inet_pton(socket.AF_INET6,\
          \ address)\n        return True\n    except socket.error:\n        return\
          \ False\n\ndef is_valid_domain_format(hostname: str) -> bool:\n    \"\"\"\
          检查域名格式是否合法（必须含点号或是localhost）\"\"\"\n    return '.' in hostname or hostname.lower()\
          \ == \"localhost\"\n\ndef normalize_hostname(hostname: str) -> str:\n  \
          \  \"\"\"将域名中的各种非标准点号替换为 ASCII 点号\"\"\"\n    if not hostname:\n        return\
          \ hostname\n    return (\n        hostname\n        .replace(\"．\", \".\"\
          )  # 全角点\n        .replace(\"。\", \".\")  # 中文句号\n        .replace(\"｡\"\
          , \".\")  # 半角日文点\n        .strip()\n    )\n\ndef contains_multiple_urls(text:\
          \ str) -> bool:\n    \"\"\"检测文本中是否包含多个URL（通过http://或https://的出现次数判断）\"\"\
          \"\n    url_pattern = re.compile(r'https?://', re.IGNORECASE)\n    matches\
          \ = url_pattern.findall(text)\n    return len(matches) >= 2\n\ndef main(url_or_ip:\
          \ str) -> dict:\n    # 预处理\n    url_or_ip = url_or_ip.strip()\n\n    # 检测是否包含多个\
          \ URL\n    if contains_multiple_urls(url_or_ip):\n        return {\"result\"\
          : 3}\n\n    # 检测是否包含空格分隔的多个输入\n    if ' ' in url_or_ip:\n        return\
          \ {\"result\": 3}\n\n    # 检查是否为纯 IP\n    if is_valid_ipv4(url_or_ip) or\
          \ is_valid_ipv6(url_or_ip):\n        return {\"result\": 1}\n\n    # 添加协议头以便解析\n\
          \    url_fixed = url_or_ip\n    if not url_or_ip.startswith(('http://',\
          \ 'https://')):\n        url_fixed = 'http://' + url_or_ip\n\n    try:\n\
          \        parsed = urlparse(url_fixed)\n        hostname = parsed.hostname\n\
          \n        if not hostname:\n            return {\"result\": 3}\n\n     \
          \   # 域名统一标准化\n        hostname = normalize_hostname(hostname)\n\n     \
          \   # 检查解析后的主机名是否为 IP\n        if is_valid_ipv4(hostname) or is_valid_ipv6(hostname):\n\
          \            return {\"result\": 2}\n\n        # 看起来像 IPv4 但无效\n       \
          \ if re.match(r\"^\\d+\\.\\d+\\.\\d+\\.\\d+$\", hostname) or (\":\" in hostname\
          \ and not is_valid_ipv6(hostname)):\n            return {\"result\": 3}\n\
          \n        # 验证域名格式和 IDNA 编码\n        try:\n            idna.encode(hostname)\n\
          \            if is_valid_domain_format(hostname):\n                return\
          \ {\"result\": 2}\n            else:\n                return {\"result\"\
          : 3}\n        except idna.IDNAError:\n            return {\"result\": 3}\n\
          \n    except Exception:\n        return {\"result\": 3}"
