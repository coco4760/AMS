          \                            # 3 路径、查询参数和片段(可选)\n        url_or_ip\n   \
          \ )\n\n    if not m:\n        # 兜底：无法解析则原样返回\n        return {\"true_target\"\
          : url_or_ip}\n\n    proto = m.group(1) or \"http://\"            # 无协议时补\
          \ http://\n    host  = m.group(2)                         # 纯 host(+端口)\n\
          \    path  = m.group(3)                         # 路径部分\n    \n    # 组合各部分，保留原始路径\n\
          \    return {\"true_target\": f\"{proto}{host}{path}\"}\n"
