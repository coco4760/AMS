    - data:
        code: "def main(inputs):\n    \"\"\"\n    Dify 节点函数：提取输入列表中的 results 数据，仅输出\
          \ data 数组\n    :param inputs: 输入列表（格式为 [{...,\"results\": [...],...}]）\n\
          \    :return: 仅包含 data 数组的结果，格式为 {\"data\": [...]}\n    \"\"\"\n    # 初始化最终要输出的\
          \ data 数组\n    output_data = []\n\n    # 1. 确保输入是列表（兼容输入格式异常的情况）\n    if\
          \ not isinstance(inputs, list):\n        inputs = [inputs]\n\n    # 2. 遍历输入列表，提取每个元素中的\
          \ results 数据\n    for item in inputs:\n        # 仅处理字典类型的元素（避免非预期数据类型报错）\n\
          \        if isinstance(item, dict):\n            # 安全获取当前元素的 results 数组（无则用空列表兜底）\n\
          \            current_results = item.get(\"results\", [])\n            #\
          \ 确保 results 是数组，避免非列表类型导致的异常\n            if isinstance(current_results,\
          \ list):\n                # 将当前 results 中的所有数据合并到输出数组\n                output_data.extend(current_results)\n\
          \n    # 3. 仅返回包含 data 数组的结果（无其他冗余字段）\n    return {\"data\": output_data}\n"
        code_language: python3
        desc: ''
        outputs:
          data:
            children: null
            type: array[object]
        selected: false
        title: 格式处理
        type: code
        variables:
        - value_selector:
          - '1753520887044'
