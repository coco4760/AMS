    - data:
        code: "def main(urls, split_count):\n    # 确保输入有效\n    if not isinstance(urls,\
          \ list):\n        urls = []\n    # 处理无效的每组元素数量（至少1个）\n    if not isinstance(split_count,\
          \ int) or split_count < 1:\n        split_count = 1\n    \n    result =\
          \ []\n    total = len(urls)\n    \n    if total == 0:\n        return {\"\
          urls\": result}\n    \n    # 按每组指定数量拆分\n    for i in range(0, total, split_count):\n\
          \        # 提取当前组的元素（从i开始，取split_count个元素）\n        group = urls[i:i+split_count]\n\
          \        # 合并成字符串并添加到结果\n        result.append(\",\".join(map(str, group)))\n\
          \    \n    # 返回指定格式的结果\n    return {\"urls\": result}\n    "
        code_language: python3
        desc: ''
        outputs:
          urls:
            children: null
            type: array[string]
        selected: false
        title: 拆分数组
        type: code
        variables:
        - value_selector:
          - '1753517809824'
          - output
          variable: urls
        - value_selector:
          - env
          - num
          variable: split_count
