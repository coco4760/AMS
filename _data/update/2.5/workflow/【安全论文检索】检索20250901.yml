    - data:
        code: "def main(query_input: str, filter_input: str, search_results: str)\
          \ -> dict:\n    \"\"\"\n    Process RAG search results to produce a structured\
          \ paper list.\n\n    Args:\n        query_input: The original query as a\
          \ string\n        filter_input: The filters as a JSON string containing\
          \ a list of filter objects\n        search_results: The raw search results\
          \ as a JSON string\n\n    Returns:\n        A dictionary containing the\
          \ structured results\n    \"\"\"\n    import json\n\n    # Initialize filters\n\
          \    filters = {\"author\": None, \"conference\": None, \"time_range\":\
          \ None, \"paper_type\": None}\n\n    # Parse filters\n    if filter_input:\n\
          \        try:\n            if not filter_input.startswith('['):\n      \
          \          filter_input = '[' + filter_input + ']'\n            filter_items\
          \ = json.loads(filter_input)\n            filter_groups = {}\n         \
          \   for item in filter_items:\n                key = item.get(\"key\")\n\
          \                value = item.get(\"value\")\n                operator =\
          \ item.get(\"operator\", \"==\")\n                if key not in filter_groups:\n\
          \                    filter_groups[key] = []\n                filter_groups[key].append({\"\
          value\": value, \"operator\": operator})\n\n            if \"JOURNAL_SOURCE_ABBREVIATION\"\
          \ in filter_groups:\n                venues = filter_groups[\"JOURNAL_SOURCE_ABBREVIATION\"\
          ]\n                filters[\"conference\"] = venues[0][\"value\"] if len(venues)\
          \ == 1 else [f\"{v['operator']}:{v['value']}\" for v in venues]\n      \
          \      if \"AUTHOR\" in filter_groups:\n                authors = filter_groups[\"\
          AUTHOR\"]\n                filters[\"author\"] = [authors[0][\"value\"]]\
          \ if len(authors) == 1 else [f\"{a['operator']}:{a['value']}\" for a in\
          \ authors]\n            if \"PUBLISH_TIME\" in filter_groups or \"PUBLISH_TIME\"\
          \ in filter_groups:\n                time_parts = []\n                if\
          \ \"PUBLISH_TIME\" in filter_groups:\n                    years = [f\"{y['operator']}:{y['value']}\"\
          \ for y in filter_groups[\"PUBLISH_TIME\"]]\n                    time_parts.append(f\"\
          Year: {', '.join(years)}\")\n                filters[\"time_range\"] = \"\
          ; \".join(time_parts)\n            if \"PAPER_TYPE\" in filter_groups:\n\
          \                filters[\"PAPER_TYPE\"] = filter_groups[\"PAPER_TYPE\"\
          ][0][\"value\"]\n\n        except Exception as e:\n            print(f\"\
          Filter parsing error: {e}\")\n\n    # Parse search results\n    try:\n \
          \       data = json.loads(search_results)\n        if \"text\" in data:\n\
          \            data = json.loads(data[\"text\"])\n        if \"body\" in data:\n\
          \            data = json.loads(data[\"body\"])\n            data = data.get(\"\
          data\")\n    except:\n        data = []\n        for line in search_results.splitlines():\n\
          \            if line.strip():\n                try:\n                  \
          \  data.append(json.loads(line))\n                except:\n            \
          \        continue\n\n    papers = {}\n\n    for chunk in data:\n       \
          \ print(\"cccccc\",chunk)\n        paper_id = chunk.get(\"doc_id\") or chunk.get(\"\
          paper_id\")\n        if not paper_id:\n            continue\n\n        score\
          \ = float(chunk.get(\"score\", 0)) if isinstance(chunk.get(\"score\"), (str,\
          \ int, float)) else 0\n        metadata = chunk.get(\"metadata\", {})\n\n\
          \        def get_field(field, default=\"\"):\n            return metadata.get(field,\
          \ chunk.get(field, default))\n\n        def try_json(value):\n         \
          \   try:\n                return json.loads(value) if isinstance(value,\
          \ str) else value\n            except:\n                return []\n\n  \
          \      # 解析字段（新格式字段名都是大写）\n        language = get_field(\"LANGUAGE\", \"\
          \")\n        authors = try_json(get_field(\"AUTHOR\", \"[]\"))\n       \
          \ abstract_en = get_field(\"ABSTRACT\", \"\")\n        abstract_zh = get_field(\"\
          ABSTRACT_ZH\", \"\")\n        title_en = get_field(\"TITLE\", \"\")\n  \
          \      title_zh = get_field(\"TITLE_ZH\", \"\")\n        ai_summary = get_field(\"\
          AI_ABSTRACT\", \"\") or (abstract_en[:200] + \"...\" if abstract_en else\
          \ \"\")\n        keywords = try_json(get_field(\"KEYWORDS\", \"[]\"))\n\
          \        qa = try_json(get_field(\"RECOMMENDED_QA\", \"[]\"))\n        ai_notes\
          \ = try_json(get_field(\"AI_NOTE\", \"[]\"))\n        quality_score = get_field(\"\
          CONTENT_QUALITY_SCORE\", \"[]\")\n\n        if paper_id not in papers:\n\
          \            papers[paper_id] = {\n                \"paper_id\": paper_id,\n\
          \                \"language\": language,\n                \"title\": {\"\
          zh\": title_zh, \"en\": title_en},\n                \"authors\": authors\
          \ if isinstance(authors, list) else [authors],\n                \"ai_summary\"\
          : ai_summary,\n                \"publication_info\": {\n               \
          \     \"journal_source\": get_field(\"JOURNAL_SOURCE_ABBREVIATION\"),\n\
          \                    # \"url\": get_field(\"SOURCE_URL\"),\n           \
          \         \"paper_type\": get_field(\"PAPER_TYPE\"),\n                 \
          \   \"publication_date\": get_field(\"PUBLISH_TIME\"),\n               \
          \     \"doi\": get_field(\"DOI\") or \"-\",\n                    \"pdf_url\"\
          : get_field(\"SOURCE_URL\"),\n                    \"code_url\": get_field(\"\
          OPENSOURCE_CODE_URL\", \"\")\n                },\n                \"keywords\"\
          : keywords,\n                \"qa\": qa,\n                \"abstract\":\
          \ {\"en\": abstract_en, \"zh\": abstract_zh},\n                \"ai_notes\"\
          : ai_notes,\n                \"content_quality_score\": quality_score,\n\
          \                \"relevance_score\": score,\n                \"scores\"\
          : [score]\n            }\n        else:\n            paper = papers[paper_id]\n\
          \            paper[\"scores\"].append(score)\n\n    # Aggregate scores\n\
          \    results = []\n    for paper in papers.values():\n        paper[\"relevance_score\"\
          ] = sum(paper[\"scores\"]) / len(paper[\"scores\"])\n        del paper[\"\
          scores\"]\n        results.append(paper)\n\n    results.sort(key=lambda\
          \ x: x[\"relevance_score\"], reverse=True)\n\n    response = {\n       \
          \ \"code\": 200,\n        \"message\": \"检索成功\",\n        \"data\": {\n\
          \            \"query\": {\"original_query\": query_input, \"filters\": filters},\n\
          \            \"results\": results\n        }\n    }\n\n    return {\"response\"\
          : response}"
        code_language: python3
        desc: ''
