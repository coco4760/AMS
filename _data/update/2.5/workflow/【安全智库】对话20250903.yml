    - data:
        code: "import json\nfrom typing import Dict, List, Any\n\ndef main(search_result:\
          \ str) -> dict:\n    \"\"\"\n    对 search_result 进行解析，只保留每个文档的前 3 个 chunk。\n\
          \    返回 {\"result\": <保留后的 json 字符串>}\n    \"\"\"\n    # 1. 解析\n    try:\n\
          \        data = json.loads(search_result)\n        if isinstance(data, dict)\
          \ and \"body\" in data:\n            body = data[\"body\"]\n           \
          \ if isinstance(body, str):\n                body = json.loads(body)\n \
          \           data = body.get(\"data\", [])\n        elif isinstance(data,\
          \ dict) and \"data\" in data:\n            data = data[\"data\"]\n     \
          \   if not isinstance(data, list):\n            data = [data]\n    except\
          \ Exception:\n        data = [json.loads(line) for line in search_result.splitlines()\
          \ if line.strip()]\n\n    # 2. 按 doc_id 分组\n    doc_map: Dict[str, List[Dict[str,\
          \ Any]]] = {}\n    for chunk in data:\n        doc_id = str(chunk.get(\"\
          doc_id\") or chunk.get(\"paper_id\") or chunk.get(\"id\"))\n        doc_map.setdefault(doc_id,\
          \ []).append(chunk)\n\n    # 3. 每个文档保留前 3 个 chunk\n    top3_chunks: List[Dict[str,\
          \ Any]] = []\n    for chunks in doc_map.values():\n        top3_chunks.extend(chunks[:5])\n\
          \n    # 4. 返回\n    return {\n        \"result\": json.dumps(top3_chunks,\
          \ ensure_ascii=False)\n    }"
