    - data:
        desc: ''
        instruction: "System Prompt:\n你是一个专门用于知识检索系统（RAG）的专家级 AI 助手。你的任务是将用户的自然语言输入解析为一个结构化的\
          \ JSON 对象。你必须识别用户查询中的核心搜索主题，并提取所有指定的元数据过滤条件。请特别注意输出格式，尤其是 filters 字段的格式要求。\
          \ User‘s input is: \n1. 核心任务\n\n分析用户输入，将其主要的检索主题与具体的过滤条件分离。\n将主要的查询主题提取为\
          \ query 字符串，它应该是查询中概念性的部分（例如：“adversarial attacks on large language models”）。\n\
          提取所有过滤条件，并根据下列规则格式化为 filters 字符串。\n\n2. 字段定义与提取规则\n\n你必须提取以下字段。如果某字段未在用户输入中提及，不要在\
          \ filters 中包含它。\n\n2.1 LANGUAGE（文档语言）\n\n键名：“LANGUAGE”\n值类型：String（如：EN,ZH）\n\
          提取逻辑：\n缩写/全称兼容：识别用户输入中的是否要求特定语言。例如：\n用户明确要求特定语言文档，\"帮我筛选英文资料关于xxxx知识点\"\
          ，生成{\"key\":\"LANGUAGE\",\"value\":EN,\"operator\":\"==\"}\n用户要看国内相关资料，默认筛选中文，\"\
          我想看近期国内的相关研究关于xxxxxx领域\"，生成\n{\"key\":\"LANGUAGE\",\"value\":ZH,\"operator\"\
          :\"==\"}\n默认情况：如果用户没有指定特定的语言，则不进行这一项过滤。\n操作符：==\n\n\n2.2 DOCUMENT_TYPE（文档类型）\n\
          \n键名：“DOCUMENT_TYPE”\n值类型：String (如:报告、技术白皮书、通报、论文、其他)\n提取逻辑：\n用户明确要看特定类型文档：如“xxx相关论文有哪些”，生成\
          \ {\"key\":\"DOCUMENT_TYPE\",\"value\":论文,\"operator\":\"==\"}\n默认情况：如果用户没有指定特定的文档类型，则不进行这一项过滤。\n\
          操作符：==\n\n2.3 CONTENT_QUALITY_SCORE（文档质量）\n\n键名：“CONTENT_QUALITY_SCORE”\n\
          值类型：Integer(0~10)\n提取逻辑：\n用户明确对文档质量有硬性要求，如”高质量“，“较为权威”，“有价值”，“非常有用”。如果无明确质量要求，则不进行这一项过滤。\n\
          如“帮我筛选有价值的资料关于xxxx”,生成 {\"key\":\"CONTENT_QUALITY_SCORE\",\"value\":7,\"\
          operator\":\">=\"}\n如“我要看关于xxxx极高质量的文档”,生成 {\"key\":\"CONTENT_QUALITY_SCORE\"\
          ,\"value\":9,\"operator\":\">=\"}\n操作符：>=\n\n\n2.4 ARTICLE_TAGS（文档标签）  \n\
          \n键名：\"ARTICLE_TAGS\"  \n值类型：String（示例\n[{\"tag\": \"Alpha-Beta Search\"\
          , \"explanation\": \"A search algorithm that aims to reduce the number of\
          \ nodes evaluated in the search tree by using lower and upper bounds.\"\
          },]  包含tag-explanation对5个）  \n提取逻辑：  \n识别用户输入中提及的特定关键词名字（那种用户特意提到的概念或领域），慎重选择关键词，如过于小众的词汇或者极难检索到的词就不要进行过滤，不输出这个标签：\
          \  \n用户明确提及提及特定关键字，优先提取第一个明确提及的关键标签。\n如用户输入“我要看“Alpha-Beta Search”相关的资料”-\
          \ 输出示例：{\"key\": \"ARTICLE_TAGS\", \"value\": \"Alpha-Beta Search\", \"\
          operator\": \"text_match_insensitive\"}\n操作符：\"text_match_insensitive\"\n\
          \n\n2.5 MAIN_CATEGORY（主要类型）\n\n键名：“MAIN_CATEGORY”（取值范围：安全基础，代码审计，二进制漏洞挖掘，Web\
          \ 安全，安全运营与蓝队，渗透测试与红队，CTF竞赛，AI 安全，标准与合规）\n值类型：String\n识别用户明确要求过滤的条件，你可以参考主要领域对应的子领域，从而有效将用户的检索要求进行映射。\n\
          可供参考的映射表：\n  \"安全基础\"对应子分类\"网络协议与架构\",\"操作系统安全\",\"编程语言与原理\",\"密码学基础\",\"\
          安全模型与体系结构\",\"经典书籍\"；\n  \"代码审计\"对应子分类\"安全编码规范\",\"静态代码分析\",\"动态行为分析\",\"\
          常见语言的漏洞模式\",\"审计案例与复现\"；\n  \"二进制漏洞挖掘\"对应子分类\"程序逆向\",\"栈溢出与缓冲区攻击\",\"格式化字符串漏洞\"\
          ,\"ROP&JOP&SROP利用\",\"Fuzzing技术\"；\n  \"Web 安全\"对应子分类\"OWASP Top 10 全解\"\
          ,\"登录与认证绕过\",\"Web防御机制与绕过\",\"Web框架安全特性\",\"常见web漏洞挖掘经验\"；\n  \"安全运营与蓝队\"\
          对应子分类\"日志与监控分析\",\"安全设备运维\",\"安全基线与主机加固\",\"安全事件响应与溯源\",\"蓝队实战经验\"；\n  \"\
          渗透测试与红队\"对应子分类\"渗透测试基础流程\",\"内网渗透与AD域\",\"权限维持与痕迹清理\",\"社工钓鱼\",\"红队工具链\"\
          ,\"红队实战经验\"；\n  \"CTF竞赛\"对应子分类\"PWN\",\"RE（逆向工程）\",\"Web\",\"Crypto\",\"\
          Misc\",\"Mobile\",\"IoT\",\"CTF概述\"\n  \"AI 安全“对应子分类\"数据投毒与后门注入\",\"提示词注入\"\
          ,\"模型窃取与推理干扰\",\"AI 辅助漏洞挖掘\",\"AI 基础知识\",\"AI相关书籍与论文\"\n  \"标准与合规\"对应子分类\"\
          国内标准\",\"国际标准\",\"安全评估流程\",\"行业合规\"\n如用户输入“数据投毒是什么？”- 输出示例：{\"key\": \"\
          MAIN_CATEGORY\", \"value\": \"AI 安全\", \"operator\": \"text_match_insensitive\"\
          }\n操作符：“text_match_insensitive”\n\n\n3. 输出格式\n你必须输出一个 JSON 对象。filters 字段必须是一个字符串，由多个\
          \ JSON 格式的过滤条件对象组成，使用英文逗号 , 分隔。不得使用 JSON 数组（即不可使用 [ ] 结构），也不要对引号进行转义。\n\n\
          示例输出格式如下：\n\n{\n“query”: “用于检索的英文主题概念内容”,\n“filters”: “{\"key\":\"key_1\"\
          ,\"value\":\"value_1\",\"operator\":\"op_1\"},{\"key\":\"key_2\",\"value\"\
          :123,\"operator\":\"op_2\"}”\n}\n\n4. 示例\n\n用户输入：检索较为有价值的关于0-day漏洞的中文报告\
          \ \n你的输出应为：\n\n{\n\"query\": \"Papers on 0-day vulnerabilities published\
          \ from 2022 to 2024\",\n\"filters\": \"{\\\"key\\\":\\\"LANGUAGE\\\",\\\"\
          value\\\":\\\"ZH\\\",\\\"operator\\\":\\\"==\\\"},{\\\"key\\\":\\\"DOCUMENT_TYPE\\\
          \",\\\"value\\\":\\\"报告\\\",\\\"operator\\\":\\\"==\\\"},{\\\"key\\\":\\\
          \"CONTENT_QUALITY_SCORE\\\",\\\"value\\\":9,\\\"operator\\\":\\\">=\\\"\
          }\"\n}\n\n\n用户输入：Cheng Li 在CCS 2022发表的关于漏洞挖掘的论文，特别是使用.NET框架的方案\n你的输出应为：\n\
          \n{\n\"query\": \"Cheng Li’s paper on vulnerability mining published in\
          \ CCS 2022, especially solutions using the .NET framework\",\n\"filters\"\
          : \"{\"key\":\"DOCUMENT_TYPE\",\"value\":\"论文\",\"operator\":\"==\"},{\"\
          key\":\"ARTICLE_TAGS\",\"value\":\".NET\",\"operator\":\"text_match_insensitive\"\
          },{\"key\":\"MAIN_CATEGORY\",\"value\":\"AI 安全\",\"operator\":\"text_match_insensitive\"\
          }\"\n}\n\n用户输入：How does dynamically generating control-flow graphs enhance\
          \ protection against control-flow hijacking attacks?\n你的输出应为：\n\n{\n\"query\"\
          : \"How does dynamically generating control-flow graphs enhance protection\
          \ against control-flow hijacking attacks?\",\n\"filters\": \"\"\n}\n"
        model:
          completion_params:
            max_tokens: 32768
            temperature: 0.7
          mode: chat
          name: SecGPT
          provider: langgenius/xinference/xinference
        parameters:
        - description: 用户输入的关键词
          name: query
          options: []
          required: true
          type: string
        - description: metedata过滤条件
          name: filters
          options: []
          required: false
          type: string
        query:
        - sys
        - query
        reasoning_mode: prompt
        selected: false
        title: 参数提取器（Filter）
        type: parameter-extractor
        variables: []
        vision:
          enabled: false
      height: 89
      id: '1752550168163'
      position:
        x: 1113.714285714286
        y: 661.2224055698939
      positionAbsolute:
        x: 1113.714285714286
        y: 661.2224055698939
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: "def main(query_input: str, filter_input: str, search_results: str)\
          \ -> dict:\n    import json\n\n    # ---------- 1. 解析过滤条件 ----------\n \
          \   filters = {\"language\": None, \"document_type\": None, \"content_quality_score\"\
          : None, \"article_tags\": None,\"main_category\":None}\n    if filter_input\
          \ and filter_input.strip():\n        try:\n            if not filter_input.strip().startswith(\"\
          [\"):\n                filter_input = \"[\" + filter_input + \"]\"\n   \
          \         for item in json.loads(filter_input):\n                key, val,\
          \ op = item.get(\"key\"), item.get(\"value\"), item.get(\"operator\", \"\
          ==\")\n                if key == \"LANGUAGE\":\n                    filters[\"\
          language\"] = [f\"{op}:{val}\"]\n                elif key == \"DOCUMENT_TYPE\"\
          :\n                    filters[\"document_type\"] = [f\"{op}:{val}\"]\n\
          \                elif key == \"ARTICLE_TAGS\":\n                    filters[\"\
          article_tags\"] = [f\"{op}:{val}\"]\n                elif key == \"PAPER_TYPE\"\
          :\n                    filters[\"paper_type\"] = [f\"{op}:{val}\"]\n   \
          \             elif key== \"MAIN_CATEGORY\":\n                    filters[\"\
          main_category\"]=[f\"{op}:{val}\"]\n        except Exception:\n        \
          \    pass\n\n    # ---------- 2. 解析搜索结果（支持多层嵌套） ----------\n    try:\n \
          \       data = json.loads(search_results)\n        # 可能是 {\"body\": \"{...}\"\
          } 或 {\"body\": {\"data\": [...]}}\n        if isinstance(data, dict) and\
          \ \"body\" in data:\n            body = data[\"body\"]\n            if isinstance(body,\
          \ str):\n                body = json.loads(body)\n            data = body.get(\"\
          data\", [])\n        elif isinstance(data, dict) and \"data\" in data:\n\
          \            data = data[\"data\"]\n        if not isinstance(data, list):\n\
          \            data = [data]\n    except Exception:\n        # 兜底：按行解析\n \
          \       data = [json.loads(line) for line in search_results.splitlines()\
          \ if line.strip()]\n\n    # ---------- 3. 合并同一文档的所有 chunks ----------\n\
          \    doc_map = {}  # key: doc_id, value: {chunks, scores, meta}\n    for\
          \ chunk in data:\n        doc_id = str(chunk.get(\"doc_id\") or chunk.get(\"\
          paper_id\") or chunk.get(\"id\"))\n        score = float(chunk.get(\"score\"\
          , 0))\n        meta = chunk.get(\"metadata\", {})\n\n        if doc_id not\
          \ in doc_map:\n            doc_map[doc_id] = {\n                \"chunks\"\
          : [],\n                \"scores\": [],\n                \"meta\": meta\n\
          \            }\n        doc_map[doc_id][\"chunks\"].append(chunk)\n    \
          \    doc_map[doc_id][\"scores\"].append(score)\n\n    # ---------- 4. 聚合为单个文档对象\
          \ ----------\n    results = []\n    for doc_id, info in doc_map.items():\n\
          \        meta = info[\"meta\"]\n        combined_content = \"\\n\".join([c.get(\"\
          content\", \"\") for c in info[\"chunks\"]])\n        authors = meta.get(\"\
          AUTHOR\") or []\n        if isinstance(authors, str):\n            authors\
          \ = [authors]\n\n        doc_obj = {\n            \"doc_id\": doc_id,\n\
          \            \"title\": meta.get(\"AI_TITLE\", \"\"),\n            # \"\
          authors\": authors,\n            \"ai_summary\": meta.get(\"SUMMARY_TEXT\"\
          , combined_content[:200] + \"...\"),\n            \"publication_info\":\
          \ {\n                \"source\": meta.get(\"JOURNAL_SOURCE_ABBREVIATION\"\
          , \"技术文档\"),\n                \"type\": meta.get(\"DOCUMENT_TYPE\") or meta.get(\"\
          file_type\", \"\"),\n                \"date\": meta.get(\"PUBLISH_TIME\"\
          ) or meta.get(\"creation_date\", \"\"),\n            },\n            # \"\
          keywords\": [t[\"tag\"] for t in json.loads(meta.get(\"ARTICLE_TAGS\", \"\
          []\"))],\n            \"content_quality_score\": float(meta.get(\"CONTENT_QUALITY_SCORE\"\
          , 0)),\n            \"relevance_score\": sum(info[\"scores\"]) / len(info[\"\
          scores\"])\n        }\n        results.append(doc_obj)\n\n    # 按平均相关性排序\n\
          \    results.sort(key=lambda x: x[\"relevance_score\"], reverse=True)\n\n\
          \    return {\n        \"response\": {\n            \"code\": 200,\n   \
          \         \"message\": \"检索成功\",\n            \"data\": {\n            \
          \    \"query\": {\"original_query\": query_input, \"filters\": filters},\n\
          \                \"results\": results\n            }\n        }\n    }"
        code_language: python3
        desc: ''
        outputs:
          response:
            children: null
            type: object
        retry_config:
          max_retries: 3
          retry_enabled: false
          retry_interval: 1000
        selected: true
        title: 结果归纳
        type: code
        variables:
        - value_selector:
          - sys
          - query
          variable: query_input
        - value_selector:
