            \ FLOPs 增加 15%，因此 $h=8$ 是效率与性能的最佳折中。\"\n  },\n  {\n    \"question\": \"\
            Transformer 的 Positional Encoding 为何选用正弦-余弦而非可学习参数？\",\n    \"answer\"\
            : \"可学习位置嵌入存在长序列外推困难、参数量随最大长度线性增长的问题。正弦-余弦函数 $PE_{(pos,2i)} = \\\\sin(pos/10000^{2i/d_{model}})$\
            \ 显式编码相对位置，满足 $f(pos+k)$ 可表示为 $f(pos)$ 的线性组合，使模型对未见长度具有良好泛化。后续研究（ALiBi、RoPE）均在此基础上改进，证明其前瞻性。\"\
