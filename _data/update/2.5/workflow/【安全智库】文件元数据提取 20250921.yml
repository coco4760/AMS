            示例：

            【网络安全防护】网络攻击识别与防御策略的关键技术及实践应用-250101

            【渗透测试技术】CVE-2020-1472漏洞内网渗透实战全流程解析-250101

            【要求】

            先通读输入内容，提炼最核心的知识主题（4-5 字）。

