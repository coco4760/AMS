    - data:
        code: "import json\nimport re\nfrom typing import List, Dict, Any\n\ndef _parse_one(raw:\
          \ str) -> List[Dict[str, Any]]:\n    \"\"\"把单个字符串里的所有 JSON 对象全部解析出来\"\"\"\
          \n    objs = []\n    pat = re.compile(r'\\{.*?}', re.S)          # 非贪婪匹配最外层\
          \ {}\n    for ln in raw.strip().splitlines():\n        for m in pat.findall(ln):\n\
          \            try:\n                objs.append(json.loads(m))\n        \
          \    except json.JSONDecodeError:\n                continue\n    return\
          \ objs\n\n\ndef main(arg1: List[str]) -> Dict[str, List[Dict[str, Any]]]:\n\
          \    objs = []\n    for raw in arg1:          # 逐个处理后续元素\n        objs.extend(_parse_one(raw))\n\
          \    return {\"result\": objs}"
