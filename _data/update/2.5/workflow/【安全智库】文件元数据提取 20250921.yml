    - data:
        code: "import re\nfrom typing import Dict\n\ndef main(arg1: str) -> Dict[str,\
          \ str]:\n    \"\"\"\n    从 Markdown 文本中提取 1 级标题和 2 级标题，保持原有格式并以换行符分隔的字符串返回。\n\
          \n    参数:\n        arg1 (str): Markdown 文件的内容。\n\n    返回:\n        Dict[str,\
          \ str]: 键为 \"result\"，值为所有提取到的标题组成的字符串（每行一个标题）。\n    \"\"\"\n    if not\
          \ isinstance(arg1, str):\n        arg1 = str(arg1)\n\n    titles = []\n\n\
          \    # 1) 匹配 ATX 风格：# 标题 或 ## 标题\n    atx_pattern = re.compile(r'^(#{1,2})\\\
          s+(.+)$', re.MULTILINE)\n    titles.extend(match.group(0) for match in atx_pattern.finditer(arg1))\n\
          \n    # 2) 匹配 Setext 风格\n    setext_pattern = re.compile(r'^(.*)\\n([=-]{3,})$',\
          \ re.MULTILINE)\n    for match in setext_pattern.finditer(arg1):\n     \
          \   underline = match.group(2)\n        if underline.startswith('='):\n\
          \            titles.append(match.group(1).strip())\n        elif underline.startswith('-'):\n\
          \            titles.append(match.group(1).strip())\n\n    return {\"result\"\
          : \"\\n\".join(titles)}"
