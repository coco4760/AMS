    - data:
        code: "import re, random\n\nAPPROX_TOKEN = re.compile(r'\\w+|[^\\w\\s]', flags=re.U)\n\
          WINDOW_TOK   = 2048\nSTEP_TOK     = WINDOW_TOK // 2\n\ndef main(arg1: str)\
          \ -> dict:          # 把 text 改为 arg1，和调用方保持一致\n    tokens = APPROX_TOKEN.findall(arg1)\n\
          \    if len(tokens) <= WINDOW_TOK:\n        return {\"result\": [{\"text\"\
          : arg1}]}\n\n    slices = [''.join(tokens[i:i+WINDOW_TOK])\n           \
          \   for i in range(0, len(tokens)-WINDOW_TOK+1, STEP_TOK)]\n\n    selected\
          \ = random.sample(slices, min(5, len(slices)))\n    return {\"result\":\
          \ [{\"text\": s} for s in selected]}"
