    - data:
        code: "import re\n\nAPPROX_TOKEN = re.compile(r'\\w+|[^\\w\\s]', flags=re.U)\n\
          WINDOW_TOK   = 4096\nSTEP_TOK     = WINDOW_TOK // 2\n\ndef main(arg1: str)\
          \ -> dict:\n    tokens = APPROX_TOKEN.findall(arg1)\n    if len(tokens)\
          \ <= WINDOW_TOK:\n        return {\"result\": [{\"text\": arg1}]}\n\n  \
          \  # 顺序保留所有切片\n    slices = [''.join(tokens[i:i+WINDOW_TOK])\n         \
          \     for i in range(0, len(tokens) - WINDOW_TOK + 1, STEP_TOK)]\n\n   \
          \ return {\"result\": [{\"text\": s} for s in slices]}"
