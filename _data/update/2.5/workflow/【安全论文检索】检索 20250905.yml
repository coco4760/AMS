    - data:
        code: "def main(query_input: str, search_results: str, extra_body: str = None)\
          \ -> dict:\n    \"\"\"\n    Process RAG search results to produce a structured\
          \ paper list.\n\n    Args:\n        query_input: The original query as a\
          \ string\n        filter_input: The filters as a JSON string containing\
          \ a list of filter objects\n        search_results: The raw search results\
          \ as a JSON string\n        extra_body: Optional raw body JSON string containing\
          \ rag_ainote_doc_id & hit_count\n\n    Returns:\n        A dictionary containing\
          \ the structured results\n    \"\"\"\n    import json\n\n    # Initialize\
          \ filters\n    filters = {\"author\": None, \"conference\": None, \"time_range\"\
          : None, \"paper_type\": None}\n\n    # Parse extra_body for hit_count mapping\
          \ (rag_ainote_doc_id -> hit_count)\n    hit_count_map = {}\n    if extra_body:\n\
          \        try:\n            extra_data = json.loads(extra_body)\n       \
          \     # 兼容两层包裹\n            if isinstance(extra_data, dict) and \"body\"\
          \ in extra_data:\n                body_parsed = json.loads(extra_data[\"\
          body\"])\n            else:\n                body_parsed = extra_data\n\
          \            if isinstance(body_parsed, dict):\n                rows = body_parsed.get(\"\
          data\", [])\n                if isinstance(rows, list):\n              \
          \      for item in rows:\n                        if not isinstance(item,\
          \ dict):\n                            continue\n                       \
          \ doc_id = item.get(\"rag_ainote_doc_id\")\n                        hit_count\
          \ = item.get(\"hit_count\", 0)\n                        if doc_id is not\
          \ None:\n                            # 强制为数值\n                         \
          \   try:\n                                hit_count_map[doc_id] = int(hit_count)\n\
          \                            except Exception:\n                       \
          \         hit_count_map[doc_id] = 0\n        except Exception as e:\n  \
          \          print(f\"Extra body parsing error: {e}\")\n\n    # Parse search\
          \ results\n    try:\n        data = json.loads(search_results) if search_results\
          \ else {}\n        data = data.get(\"data\")\n        # 若仍是 dict 或 None，兜底为空列表\n\
          \        if not isinstance(data, list):\n            data = []\n    except\
          \ Exception:\n        data = []\n        # 行流式兜底\n        for line in (search_results\
          \ or \"\").splitlines():\n            if line.strip():\n               \
          \ try:\n                    obj = json.loads(line)\n                   \
          \ data.append(obj)\n                except Exception:\n                \
          \    continue\n\n    papers = {}\n\n    for chunk in data:\n        if not\
          \ isinstance(chunk, dict):\n            continue\n        paper_id = chunk.get(\"\
          doc_id\") or chunk.get(\"paper_id\")\n        if not paper_id:\n       \
          \     continue\n\n        # 优先用 extra_body 里的 hit_count（通过 rag_ainote_doc_id\
          \ == paper_id 关联）\n        if paper_id in hit_count_map:\n            score\
          \ = int(hit_count_map[paper_id])\n        else:\n            raw_score =\
          \ chunk.get(\"score\", 0)\n            score = int(raw_score) if isinstance(raw_score,\
          \ (str, int, float)) else 0\n\n        metadata = chunk.get(\"metadata\"\
          , {}) if isinstance(chunk.get(\"metadata\", {}), dict) else {}\n\n     \
          \   def get_field(field, default=\"\"):\n            return metadata.get(field,\
          \ chunk.get(field, default))\n\n        def try_json(value):\n         \
          \   try:\n                return json.loads(value) if isinstance(value,\
          \ str) else value\n            except Exception:\n                return\
          \ []\n\n        language = get_field(\"LANGUAGE\", \"\")\n        authors\
          \ = try_json(get_field(\"AUTHOR\", \"[]\"))\n        abstract_en = get_field(\"\
          ABSTRACT\", \"\")\n        abstract_zh = get_field(\"ABSTRACT_ZH\", \"\"\
          )\n        title_en = get_field(\"TITLE\", \"\")\n        title_zh = get_field(\"\
          TITLE_ZH\", \"\")\n        ai_summary = get_field(\"AI_ABSTRACT\", \"\"\
          ) or (abstract_en[:200] + \"...\" if abstract_en else \"\")\n        keywords\
          \ = try_json(get_field(\"KEYWORDS\", \"[]\"))\n        qa = try_json(get_field(\"\
          RECOMMENDED_QA\", \"[]\"))\n        ai_notes = try_json(get_field(\"AI_NOTE\"\
          , \"[]\"))\n        quality_score = get_field(\"CONTENT_QUALITY_SCORE\"\
          , \"[]\")\n\n        if paper_id not in papers:\n            papers[paper_id]\
          \ = {\n                \"paper_id\": paper_id,\n                \"language\"\
          : language,\n                \"title\": {\"zh\": title_zh, \"en\": title_en},\n\
          \                \"authors\": authors if isinstance(authors, list) else\
          \ [authors],\n                \"ai_summary\": ai_summary,\n            \
          \    \"publication_info\": {\n                    \"journal_source\": get_field(\"\
          JOURNAL_SOURCE_ABBREVIATION\"),\n                    \"paper_type\": get_field(\"\
          PAPER_TYPE\"),\n                    \"publication_date\": get_field(\"PUBLISH_TIME\"\
          ),\n                    \"doi\": get_field(\"DOI\") or \"-\",\n        \
          \            \"pdf_url\": get_field(\"SOURCE_URL\"),\n                 \
          \   \"code_url\": get_field(\"OPENSOURCE_CODE_URL\", \"\")\n           \
          \     },\n                \"keywords\": keywords,\n                \"qa\"\
          : qa,\n                \"abstract\": {\"en\": abstract_en, \"zh\": abstract_zh},\n\
          \                \"ai_notes\": ai_notes,\n                \"content_quality_score\"\
          : quality_score,\n                \"relevance_score\": score,\n        \
          \        \"scores\": [score]\n            }\n        else:\n           \
          \ papers[paper_id][\"scores\"].append(score)\n\n    # Aggregate scores\n\
          \    results = []\n    for paper in papers.values():\n        # paper[\"\
          relevance_score\"] = sum(paper[\"scores\"]) / len(paper[\"scores\"]) if\
          \ paper[\"scores\"] else 0.0\n        paper[\"relevance_score\"] = paper[\"\
          scores\"][0] if paper[\"scores\"] else 0\n        del paper[\"scores\"]\n\
          \        results.append(paper)\n\n    results.sort(key=lambda x: x[\"relevance_score\"\
          ], reverse=True)\n\n    response = {\n        \"code\": 200,\n        \"\
          message\": \"检索成功\",\n        \"data\": {\n            \"query\": {\"original_query\"\
          : query_input, \"filters\": filters},\n            \"results\": results\n\
          \        }\n    }\n\n    return {\"response\": response}"
