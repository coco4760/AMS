    - data:
        code: "import requests\n\ndef main(arg1: str, arg2: str, base_host: str, api_key:\
          \ str) -> dict:\n    KB_ID = (arg1 or \"\").strip()\n    BASE = base_host\
          \ + \"/api/v1/documents\"\n    headers = {\"accept\": \"application/json\"\
          , \"X-API-Key\": api_key}\n\n    # 解析 doc_ids：支持 \"a,b c\" 或 \"doc_ids=a&doc_ids=b\"\
          \n    raw = (arg2 or \"\").strip()\n    parts = []\n    for tok in raw.replace(\"\
          ,\", \" \").replace(\"&\", \" \").split():\n        if tok.startswith(\"\
          doc_ids=\"):\n            tok = tok[8:]\n        if tok:  # 简单校验：只要非空就收\n\
          \            parts.append(tok)\n\n    # 去重并保持顺序\n    seen = set()\n    ids\
          \ = []\n    for x in parts:\n        if x not in seen:\n            seen.add(x)\n\
          \            ids.append(x)\n\n    # 分批（每批最多 50 个）\n    chunks = [ids[i:i+50]\
          \ for i in range(0, len(ids), 50)] if ids else []\n\n    all_items, errors\
          \ = [], []\n    for batch in chunks:\n        qs = \"&\".join(f\"doc_ids={i}\"\
          \ for i in batch)  # doc_id 为 hex，无需额外转义\n        url = f\"{BASE}/{KB_ID}/batch_detail?{qs}\"\
          \n        try:\n            r = requests.get(url, headers=headers, timeout=30)\n\
          \            if r.status_code == 200:\n                j = r.json()\n  \
          \              if isinstance(j, dict) and \"data\" in j and isinstance(j[\"\
          data\"], list):\n                    all_items.extend(j[\"data\"])\n   \
          \             else:\n                    errors.append({\"batch_size\":\
          \ len(batch), \"reason\": \"unexpected_response\"})\n            else:\n\
          \                errors.append({\"batch_size\": len(batch), \"status\":\
          \ r.status_code, \"text\": r.text[:200]})\n        except Exception as e:\n\
          \            errors.append({\"batch_size\": len(batch), \"error\": str(e)})\n\
          \n    # 结果按 doc_id 去重\n    dedup_seen, dedup = set(), []\n    for it in\
          \ all_items:\n        did = (it.get(\"doc_id\") or \"\").strip()\n     \
          \   if did and did not in dedup_seen:\n            dedup_seen.add(did)\n\
