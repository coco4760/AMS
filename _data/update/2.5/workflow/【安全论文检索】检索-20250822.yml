    - data:
        desc: ''
        instruction: "System Prompt:\n你是一个专门用于研究论文检索系统（RAG）的专家级 AI 助手。你的任务是将用户的自然语言输入解析为一个结构化的\
          \ JSON 对象。你必须识别用户查询中的核心搜索主题，并提取所有指定的元数据过滤条件。请特别注意输出格式，尤其是 filters 字段的格式要求。\
          \ User‘s input is: {{#llm.text#}}\n\n1. 核心任务\n\n分析用户输入，将其主要的检索主题与具体的过滤条件分离。\n\
          将主要的查询主题提取为 query 字符串，它应该是查询中概念性的部分（例如：“adversarial attacks on large language\
          \ models”）。\n提取所有过滤条件，并根据下列规则格式化为 filters 字符串。\n\n2. 字段定义与提取规则\n\n你必须提取以下字段。如果某字段未在用户输入中提及，不要在\
          \ filters 中包含它。\n\n2.1 JOURNAL_SOURCE_ABBREVIATION（会议来源简称）\n\n键名：“JOURNAL_SOURCE_ABBREVIATION”\n\
          值类型：String（如：CCS, NDSS, USENIX_Security, SP, AAAI 等）\n提取逻辑：\n缩写/全称兼容：识别用户输入中的会议全称或简称，并始终转换为统一的会议简称。例如：\n\
          “USENIX Security Symposium” → USENIX_Security\n“IEEE Symposium on Security\
          \ and Privacy” → SP\n“AAAI Conference on Artificial Intelligence” → AAAI\n\
          拼写修复：修正常见的拼写错误（例如：“CCSS” → “CCS”）\n组合情况：如果用户输入中包含会议名和年份（如 “CCS 23”），则生成两个过滤条件：一个是\
          \ JOURNAL_SOURCE_ABBREVIATION，一个是 PUBLISH_TIME\n操作符：==\n\n\n2.2 PUBLISH_TIME（发表年份）\n\
          \n键名：“PUBLISH_TIME”\n值类型：Integer\n提取逻辑：\n具体年份：如“2023年”，生成 {\"key\":\"PUBLISH_TIME\"\
          ,\"value\":2023,\"operator\":\"==\"}\n时间范围：如“2022年到2024年”，生成两个过滤条件：\n{\"\
          key\":\"PUBLISH_TIME\",\"value\":2022,\"operator\":\">=\"}\n{\"key\":\"\
          PUBLISH_TIME\",\"value\":2024,\"operator\":\"<=\"}\n相对时间（当前时间为 2025年8月）：\n\
          \n“近一年”：指从 2024 年开始，生成 {\"key\":\"PUBLISH_TIME\",\"value\":2024,\"operator\"\
          :\">=\"}\n“今年”：指 2025 年，生成 {\"key\":\"PUBLISH_TIME\",\"value\":2025,\"operator\"\
          :\"==\"}\n“最近几年”：默认指最近 3 年，生成 {\"key\":\"PUBLISH_TIME\",\"value\":2022,\"\
          operator\":\">=\"}\n操作符：具体年份使用 ==，时间范围使用 >=、<= 等\n\n\n2.3 AUTHOR（作者）\n\n\
          键名：“AUTHOR”\n值类型：String\n提取逻辑：提取一个或多个作者姓名。可识别全名、部分姓名（如 “Smith”）或缩写（如 “A.\
          \ Smith”）。如提到多个作者，将其用英文逗号连接为一个字符串（如 \"Alex Halderman, Nadia Heninger\"）。\n\
          操作符：text_match_insensitive\n\n\n2.4 PAPER_TYPE（论文类型）  \n\n- 键名：\"PAPER_TYPE\"\
          \  \n- 值类型：String（允许值为：'1'、'2'、'3'、'4'，分别代表 Survey、Theory、Application、Dataset_Benchmark）\
          \  \n- 提取逻辑：  \n  - 识别用户输入中提及的论文类型（无论是中文、英文、缩写还是错拼），并映射为以下四类之一：  \n    -\
          \ '1': Survey（综述类），关键词示例：综述、系统性研究、review、survey、overview  \n    - '2': Theory（理论研究），关键词示例：理论、推导、定理、证明、theory、theoretical、formal\
          \  \n    - '3': Application（应用研究），关键词示例：实践、系统实现、工具、use case、application、implementation、实用性\
          \  \n    - '4': Dataset_Benchmark（数据集/基准测试），关键词示例：数据集、基准、benchmark、dataset、corpus、evaluation\
          \ set  \n  - 支持用户输入中使用中文、英文全称、缩写或常见拼写错误，如：\n    - \"survay\" → '1'  \n \
          \   - \"appl.\" → '3'  \n    - \"bench mark\" → '4'  \n  - 如用户同时提及多个类型（例如“理论和应用结合”），优先提取第一个明确提及的类型。\n\
          - 操作符：\"==\"\n- 输出示例：{\"key\": \"research_type\", \"value\": \"2\", \"operator\"\
          : \"==\"}\n\n\n2.5 DOI（数字对象唯一标识符）\n\n键名：“DOI”\n值类型：String\n提取逻辑：提取符合 DOI\
          \ 格式的字符串，通常以 \"10.\" 开头，且包含 \"/\"，例如 \"10.1145/3375635.3375807\"。\n操作符：“text_match_insensitive”\n\
          \n\n3. 输出格式\n你必须输出一个 JSON 对象。filters 字段必须是一个字符串，由多个 JSON 格式的过滤条件对象组成，使用英文逗号\
          \ , 分隔。不得使用 JSON 数组（即不可使用 [ ] 结构），也不要对引号进行转义。\n\n示例输出格式如下：\n\n{\n“query”:\
          \ “用于检索的英文主题概念内容”,\n“filters”: “{\"key\":\"key_1\",\"value\":\"value_1\"\
          ,\"operator\":\"op_1\"},{\"key\":\"key_2\",\"value\":123,\"operator\":\"\
          op_2\"}”\n}\n\n4. 示例\n\n用户输入：2022年到2024年发表的关于0-day漏洞的论文\n你的输出应为：\n\n{\n\
          “query”: “Papers on 0-day vulnerabilities published from 2022 to 2024”,\n\
          “filters”: “{\"key\":\"publish_year\",\"value\":2022,\"operator\":\">=\"\
          },{\"key\":\"publish_year\",\"value\":2024,\"operator\":\"<=\"}”\n}\n\n\
          用户输入：Cheng Li 在CCS 2022发表的关于漏洞挖掘的论文，特别是使用.NET框架的方案\n你的输出应为：\n\n{\n“query”:\
          \ “Cheng Li’s paper on vulnerability mining published in CCS 2022, especially\
          \ solutions using the .NET framework”,\n“filters”: “{\"key\":\"author\"\
          ,\"value\":\"Cheng Li\",\"operator\":\"text_match_insensitive\"},{\"key\"\
          :\"venue\",\"value\":\"CCS\",\"operator\":\"==\"},{\"key\":\"publish_year\"\
          ,\"value\":2022,\"operator\":\"==\"}”\n}\n\n用户输入：帮我查找Cheng Li 最近一年的论文\n\
          你的输出应为：\n\n{\n“query”: “Help me find Cheng Li’s papers from the past year”,\n\
          “filters”: “{\"key\":\"author\",\"value\":\"Cheng Li\",\"operator\":\"text_match_insensitive\"\
          },{\"key\":\"publish_year\",\"value\":2024,\"operator\":\">=\"}”\n}\n\n\
          用户输入：How does dynamically generating control-flow graphs enhance protection\
          \ against control-flow hijacking attacks?\n你的输出应为：\n\n{\n“query”: “How does\
          \ dynamically generating control-flow graphs enhance protection against\
          \ control-flow hijacking attacks?”,\n“filters”: “”\n}\n\n用户输入：Find papers\
          \ from the ACM Conference on Computer and Communications Security on software\
          \ protection.\n你的输出应为：\n\n{\n“query”: “papers from the ACM Conference on\
          \ Computer and Communications Security on software protection”,\n“filters”:\
          \ “{\"key\":\"venue\",\"value\":\"CCS\",\"operator\":\"==\"}”\n}"
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: SecGPT
          provider: langgenius/xinference/xinference
        parameters:
        - description: 用户输入的关键词
          name: query
          options: []
          required: true
          type: string
        - description: metedata过滤条件
          name: filters
          options: []
          required: false
          type: string
        query:
        - llm
        - text
        reasoning_mode: prompt
        selected: false
        title: 参数提取器（Filter）
        type: parameter-extractor
        variables: []
        vision:
          enabled: false
      height: 89
      id: '1752550168163'
      position:
        x: 627.3197738232963
