    - data:
        code: "def main(memory: list[str], query: str) -> dict:\n    DEFAULT_TEMPLATE\
          \ = \"\"\"\\ Given a conversation (between Human and Assistant) and a follow\
          \ up message from Human, \\ rewrite the message to be a standalone question\
          \ that captures all relevant context \\ from the conversation. <Chat History>\
          \ {chat_history} <Follow Up Message> {question} <Standalone question> \"\
          \"\"\n\n    chat_history = \"\"\n    for idx, msg in enumerate(memory):\n\
          \        role = \"user\" if idx % 2 == 0 else \"assistant\"\n        chat_history\
          \ += (\"\\n\" if chat_history else \"\") + f\"{role}: {msg}\"\n\n    prompt\
          \ = DEFAULT_TEMPLATE.format(chat_history=chat_history, question=query)\n\
          \n    return {\n        \"result\": prompt,\n    }"
        code_language: python3
