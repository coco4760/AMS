  collabnet_node_manager:
    name: "调度节点"
    description: "自研调度工具agent"
    images:
      - name: "rd.clouditera.com/infra/collabnet"
        tags: ["v2.7-node_manager-x86_64-test-8"]
  

  filems:
    name: "filems"
    description: "minio 分布式调度工具"
    images:
      - name: "rd.clouditera.com/infra/filems"
        tags: ["sast-v2.5-0"]

  iam:
    name: "keyloak"
    description: "认证服务"
    images:
      - name: "rd.clouditera.com/sca-sast-lib/library/keycloak"
        tags: ["22.0.0"]

  kong:
    name: "kong"
    description: "网关"
    images:
      - name: "rd.clouditera.com/sca-sast-lib/kong"
        tags: ["3.7.0"]
      - name: "rd.clouditera.com/sca-sast-lib/kong"
        tags: ["3.7.0"]
      - name: "rd.clouditera.com/sca-sast-lib/kong/deck"
        tags: ["v1.37.0"]
  mineru:
    name: "minerU"
    description: "PDF 解析"
    images:
      - name: "rd.clouditera.com/aigc/mineru"
        tags: ["v1.3.12"]
  nacos:
    name: "nacos"
    description: "配置中心"
    images:
      - name: "rd.clouditera.com/aigc/nacos-server"
        tags: ["v2.4.3"]

  rabbitmq:
    name: "rabbitmq"
    description: "消息队列"
    images:
      - name: "rd.clouditera.com/library/rabbitmq"
        tags: ["4.1.3-management"]

  rag_server:
    name: "rag_server"
    description: "rag 服务"
    images:
      - name: "rd.clouditera.com/aigc/rag_service"
        tags: ["x86_64-0.5.0-backend"]
      - name: "rd.clouditera.com/aigc/rag_service"
        tags: ["x86_64-0.5.0-frontend"]
      - name: "rd.clouditera.com/library/pgvector"
        tags: ["pg17"]
      - name: "rd.clouditera.com/library/redis"
        tags: ["latest"]

# 环境特定配置
environments:
  dev:
    description: "开发环境"
    tag_suffix: "dev"
    required_categories: ["services"]
    
  test:
    description: "测试环境"
    tag_suffix: "test"
    required_categories: ["ai_brain", "services", "asset_judgment", "clouditera_plugin", "clouditera_plugin_for_vul", "clouditera_plugin_sectools", "clouditera_plugin_wireshark", "defect_judgement", "email_check", "firecrawl", "mcp_tools", "ragflow", "unstructured", "storage", "collabnet", "collabnet_node_manager", "filems", "iam", "kong", "mineru", "nacos", "rabbitmq", "rag_server"]
    
  prod:
    description: "生产环境"
    tag_suffix: "prod"
    required_categories: ["ai_brain", "services", "asset_judgment", "clouditera_plugin", "clouditera_plugin_for_vul", "clouditera_plugin_sectools", "clouditera_plugin_wireshark", "defect_judgement", "email_check", "firecrawl", "mcp_tools", "ragflow", "unstructured", "storage", "collabnet", "collabnet_node_manager", "filems", "iam", "kong", "mineru", "nacos", "rabbitmq", "rag_server"]

# 下载策略配置
download_strategy:
  parallel_downloads: 3
  retry_count: 3
  timeout_seconds: 300
  skip_existing: true
  
