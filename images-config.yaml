# Docker镜像配置文件
# 支持版本控制、环境区分和分类管理

# 全局配置
global:
  default_tag: "latest"
  environments:
    - dev
    - test
    - prod

# 镜像分类配置
categories:
  ai_brain:
    name: "AI大脑平台"
    description: "核心AI智能体应用服务"
    images:
      - name: "rd.clouditera.com/aigc/ai-intelligence-api"
        tags: ["v6.3.1.post6"]
      - name: "rd.clouditera.com/aigc/ai-intelligence-web"
        tags: ["v6.3.1"]
      - name: "rd.clouditera.com/aigc/ai-intelligence-sandbox"
        tags: ["0.2.11"]
      - name: "rd.clouditera.com/aigc/ai-intelligence-plugin-daemon"
        tags: ["0.0.7"]
      - name: "rd.clouditera.com/infra/nginx"
        tags: ["latest"]

  services:
    name: "业务服务"
    description: "主要业务逻辑服务 web版本: 主线：v3.3.87  冀北：v3.3.88  国网：v3.3.84"
    images:
      - name: "rd.clouditera.com/aigc/sast-http-api"
        tags: ["v5.2.34"]
      - name: "rd.clouditera.com/aigc/client-http-api"
        tags: ["v3.8.46"]
      - name: "rd.clouditera.com/aigc/auth-http-api"
        tags: ["v1.5.5"]
      - name: "rd.clouditera.com/aigc/client-web"
        tags: ["v3.3.87"]
      - name: "rd.clouditera.com/aigc/client-web"
        tags: ["v3.3.88"]
      - name: "rd.clouditera.com/aigc/client-web"
        tags: ["v3.3.84"]

  asset_judgment:
    name: "资产研判"
    description: "能力支撑"
    images:
      - name: "rd.clouditera.com/plugin/crawl4ai"
        tags: ["v4.1"]
      - name: "rd.clouditera.com/plugin/title"
        tags: ["v1.0"]
      - name: "rd.clouditera.com/plugin/favicon"
        tags: ["latest"]
      - name: "rd.clouditera.com/plugin/urlfinder"
        tags: ["latest"]

  clouditera_plugin:
    name: "云起插件"
    description: "能力支撑"
    images:
      - name: "rd.clouditera.com/aigc/ai-plugin-projects"
