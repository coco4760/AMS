        tags: ["8.12.2"]
      - name: "rd.clouditera.com/infra/minio"
        tags: ["RELEASE.2023-08-16T20-17-30Z"]
      - name: "rd.clouditera.com/sca-sast-lib/mongo"
        tags: ["5.0.5"]
      - name: "rd.clouditera.com/sca-sast-lib/library/mysql"
        tags: ["8.0.34"]
      - name: "rd.clouditera.com/sca-sast-lib/postgres"
        tags: ["15-alpine"]
      - name: "rd.clouditera.com/sca-sast-lib/library/qdrant"
        tags: ["v1.9.3"]
      - name: "rd.clouditera.com/sca-sast-lib/library/redis"
        tags: ["7.2.0"]

  collabnet:
    name: "调度工具"
    description: "自研调度工具"
