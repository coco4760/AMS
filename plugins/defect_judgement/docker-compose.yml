services:
  llm_sast_backend:
    image: rd.clouditera.com/aigc/llm_sast:x86_64-0.2.0-backend
    ports:
      - "8030:8081"
    volumes:
      - ./data/backend:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - POSTGRES_SERVER=postgres
      - UPLOAD_DIR=/app/data/uploads
      - CACHE_DIR=/app/data/cache
    env_file:
      - .env
    depends_on:
      - postgres
    restart: always
    networks:
      - llm-sast-network

  llm_sast_frontend:
    image: rd.clouditera.com/aigc/llm_sast:x86_64-0.2.0-frontend
    ports:
      - "8031:8080"
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - POSTGRES_SERVER=postgres
      - UPLOAD_DIR=/app/data/uploads
    env_file:
      - .env
    depends_on:
      - postgres
    restart: always
    networks:
      - llm-sast-network

  postgres:
    image: rd.clouditera.com/library/pgvector:pg17
    ports:
      - "5432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=llm_sast
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: always
    networks:
      - llm-sast-network

volumes:
  postgres-data:

networks:
  llm-sast-network:
    driver: bridge
