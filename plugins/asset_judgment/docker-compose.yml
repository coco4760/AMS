services:
  assetmind:
    image: rd.clouditera.com/aigc/plugins/assetmind:2.1
    container_name: assetmind
    ports:
      - "11001:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DEBUG=false
      - LOG_LEVEL=INFO
      - PIPELINE_TOTAL_TIMEOUT=40.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 解决权限问题：以root用户运行，确保能写入挂载的目录
    user: "0:0"