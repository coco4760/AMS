services:
  plugin-wireshrk:
    image: rd.clouditera.com/aigc/plugin-wireshark:v0.3.12-stable
    restart: always
    env_file:
      - .env
    volumes:
      - ${INSTALL_LOCAL}/plugin/data:/app/data
      - ${INSTALL_LOCAL}/plugin/nuclei-templates:/root/nuclei-templates
    ports:
      - "18005:5000"
