# 接收器配置：定义 Collector 如何接收数据
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"  # 启用 gRPC 协议监听 (默认端口 4317)，Python SDK 默认使用此方式
      http: 
        endpoint: "0.0.0.0:4318"  # 启用 HTTP 协议监听 (默认端口 4318)

# 处理器配置：在数据导出之前进行加工处理
processors:
  batch: {}
  transform:
    error_mode: ignore
    log_statements:
      - set(log.attributes["log_level"], log.severity_text)

# 导出器配置：定义数据最终发送到哪里
exporters:
  debug: # Debug 导出器：替代已废弃的 logging 导出器
    verbosity: detailed # 详细模式：打印完整的结构化数据，便于调试
  otlphttp/loki:
    endpoint: "http://loki:3100"  # 基础地址
    logs_endpoint: "http://loki:3100/otlp/v1/logs" # Loki 的 OTLP 日志入口
    tls:
      insecure: true  # Loki 无 HTTPS 时需要

# 服务配置：将接收器、处理器和导出器组装成流水线 (Pipelines)
service:
  pipelines:
    # 链路追踪 (Traces) 流水线
    traces:
      receivers: [otlp]   # 数据来源：OTLP 接收器
      # processors: [batch] # 数据处理：仅进行批处理
      exporters: [debug] # 数据去向：打印到控制台 (生产环境建议配置 Jaeger 或 Tempo)
    
    # 指标 (Metrics) 流水线
    metrics:
      receivers: [otlp]   # 数据来源：OTLP 接收器
      processors: [batch] # 数据处理：进行批处理
      exporters: [debug] # 数据去向：打印到控制台 (生产环境建议配置 Prometheus 或其他 metrics 后端)
    
    # 日志 (Logs) 流水线
    logs:
      receivers: [otlp]   # 数据来源：OTLP 接收器
      processors: [batch, transform] # 数据处理：先进行批处理，然后添加/修改资源标签
      exporters: [debug, otlphttp/loki] # 数据去向：同时打印到控制台(调试用) 和 发送到 Loki(存储用)