# -----------------------------
# Loki 全局配置
# -----------------------------
auth_enabled: false   # 是否启用身份认证，false 表示无需用户名/密码即可访问 Loki HTTP API

# -----------------------------
# HTTP 服务配置
# -----------------------------
server:
  http_listen_port: 3100   # Loki HTTP API 监听端口，Grafana 和 OTEL HTTP exporter 默认通过这个端口推送/拉取数据

# -----------------------------
# 通用配置
# -----------------------------
common:
  instance_addr: 127.0.0.1   # 当前 Loki 实例地址，用于 ring 和 peer 通信
  path_prefix: /loki          # API 路径前缀，用于区分 Loki HTTP 请求路径
  storage:
    filesystem:
      chunks_directory: /loki/chunks   # TSDB 存储 chunk 文件的目录，存储实际日志数据
      rules_directory: /loki/rules     # 存储 alert/ruler 规则文件的目录
  replication_factor: 1     # 数据副本数，单实例通常为 1
  ring:
    kvstore:
      store: inmemory        # 元数据存储方式，用于分布式 ring 管理，inmemory 表示单节点，非持久化

# -----------------------------
# Schema 配置
# -----------------------------
schema_config:
  configs:
    - from: 2020-10-24           # 该 schema 的生效起始时间
      store: tsdb                # 存储类型为 TSDB（time-series database）
      object_store: filesystem   # 使用本地文件系统存储 chunk
      schema: v13                # schema 版本，用于 index + chunk 组织数据
      index:
        prefix: index_           # 索引文件名前缀
        period: 24h              # 索引文件切分周期（每天生成一个索引文件）

# -----------------------------
# 限制配置
# -----------------------------
limits_config:
  otlp_config:                   # OpenTelemetry Protocol (OTLP) 接收器配置，用于接收 OTEL 格式的日志数据
    log_attributes:              # 日志属性处理规则，定义如何将 OTEL 日志属性转换为 Loki 标签
      # 将 log_level 映射成索引标签
      - action: index_label      # 动作类型为 index_label，表示将指定属性转换为可索引的标签（用于查询和过滤）
        attributes:              # 需要转换为标签的属性列表
          - log_level            # 将 log_level 属性转换为 Loki 标签，便于按日志级别进行过滤和查询
# -----------------------------
# Ruler 配置
# -----------------------------
ruler:
  alertmanager_url: http://localhost:9093  # 指定 Alertmanager 地址，用于触发告警
